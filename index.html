<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ogonz">
<meta name="theme-color" content="#15110d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Ogonz</title>
</head>
<body>
<div id="stage">
  <canvas id="view" aria-label="Sunset Trailer Haven"></canvas>
  <div id="hud" class="box">
    <div id="clock">Day 1</div>
    <div id="cash"></div>
    <div id="schemes"></div>
    <div id="top"></div>
    <div id="speeds" role="group" aria-label="Game speed">
      <button data-speed="0" aria-label="Pause">❚❚</button>
      <button data-speed="1" aria-label="Normal speed">▶</button>
      <button data-speed="4" aria-label="Fast">▶▶</button>
      <button data-speed="15" aria-label="Fastest">▶▶▶</button>
    </div>
  </div>
  <div id="spot" class="box" aria-live="polite"></div>
  <ul id="news" class="box"></ul>
</div>
<div id="rotate"><div class="phone"></div><strong>Turn your device sideways</strong><span>Ogonz plays in landscape.</span></div>
<script type="module" src="src/main.js"></script>
</body>
</html>

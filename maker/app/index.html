<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vale Maker">
<meta name="theme-color" content="#070a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
<title>Vale Maker</title>
</head>
<body>
<main id="library">
  <header>
    <h1>Vale Maker</h1>
    <button id="new-btn" class="primary">New game</button>
  </header>
  <p id="status" class="muted"></p>
  <ul id="projects"></ul>
  <p id="empty" class="muted" hidden>No games yet. Tap “New game” to start from a template.</p>
</main>

<dialog id="new-dialog">
  <form method="dialog">
    <h2>New game</h2>
    <label>Name <input id="new-name" maxlength="60" autocomplete="off"></label>
    <fieldset id="templates"><legend>Template</legend></fieldset>
    <menu>
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="ok" class="primary">Create</button>
    </menu>
  </form>
</dialog>

<section id="player" hidden>
  <div id="stage"></div>
  <button id="close-btn" aria-label="Back to library">✕</button>
  <div id="error" hidden>
    <strong>The game hit an error</strong>
    <pre id="error-text"></pre>
    <div class="row">
      <button id="error-copy">Copy details</button>
      <button id="error-dismiss">Dismiss</button>
    </div>
  </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>

# Generate the Xcode project with XcodeGen (brew install xcodegen):
#   cd ios && xcodegen generate && open ValeMaker.xcodeproj
name: ValeMaker
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  ValeMaker:
    type: application
    platform: iOS
    sources:
      - path: ValeMaker
      # The web app is bundled as a folder reference named "app".
      - path: ../app
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.valemaker
        INFOPLIST_FILE: ValeMaker/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

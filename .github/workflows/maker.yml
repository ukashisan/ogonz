name: Vale Maker

on:
  push:
    paths: ["maker/**", ".github/workflows/maker.yml"]
  pull_request:
    paths: ["maker/**", ".github/workflows/maker.yml"]
  workflow_dispatch:

jobs:
  web-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshot
          path: maker/smoke-test.png
          if-no-files-found: ignore

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: maker/ios
      - run: >
          xcodebuild build
          -project ValeMaker.xcodeproj -scheme ValeMaker
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
        working-directory: maker/ios
